name: Release APK

# Builds a signed release APK and publishes it to a GitHub Release whenever
# you push a version tag like v1.1 or v2.0.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64    - your release keystore (.jks) encoded as base64
#   KEYSTORE_PASSWORD  - the keystore (store) password
#   KEY_ALIAS          - the key alias inside the keystore
#   KEY_PASSWORD       - the key (alias) password
#   SUPABASE_AI_FUNCTION_URL - SignVibe AI function URL (same as supabase.aiFunctionUrl in local.properties)
#   SUPABASE_ANON_KEY        - Supabase anon key (same as supabase.anonKey in local.properties)
#
# To create the base64 keystore secret on your machine:
#   Windows PowerShell:  [Convert]::ToBase64String([IO.File]::ReadAllBytes("release.jks")) > keystore.b64.txt
#   macOS/Linux:         base64 -w0 release.jks > keystore.b64.txt
# then paste the contents of keystore.b64.txt as KEYSTORE_BASE64.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # needed to create the GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Derive version from tag
        run: |
          echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Decode signing keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SUPABASE_AI_FUNCTION_URL: ${{ secrets.SUPABASE_AI_FUNCTION_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Fail the release instead of shipping an APK whose AI chat can't connect.
          if [ -z "$SUPABASE_AI_FUNCTION_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_AI_FUNCTION_URL / SUPABASE_ANON_KEY repo secrets are not set"
            exit 1
          fi
          ./gradlew assembleRelease --no-daemon

      - name: Stage the APK under a friendly name
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/SignVibe-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/SignVibe-${{ github.ref_name }}.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}